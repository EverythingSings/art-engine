name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5        # v4.3.1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5      # v2.8.2

      - name: Format
        run: bash xtask.sh fmt

      - name: Clippy
        run: bash xtask.sh clippy

      - name: Test
        run: bash xtask.sh test

      - name: Doc
        run: bash xtask.sh doc

      - name: WASM
        run: bash xtask.sh wasm

      # Phase 2 GPU pipeline tests. We install Mesa + libEGL so the headless
      # EGL/GLES path can run via the llvmpipe software renderer. Set
      # `ART_ENGINE_REQUIRE_GL=1` (inside the xtask) so the tests fail loudly
      # if EGL is missing rather than silently skipping.
      - name: Install Mesa for headless GL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libegl-mesa0 libgl1-mesa-dri libglvnd0

      - name: Visual test (GPU pipeline)
        run: bash xtask.sh visual-test
