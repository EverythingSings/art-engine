id: CAP-LIST-ENGINES
name: List Engines and Palettes
status: draft
version: 0.1.0
stability: provisional
description: >
  Enumerate the available engines (registered `Engine` implementations:
  gray-scott, physarum, etc.) and the named palettes (ocean, amber, …)
  that the renderer can use. Read-only introspection — no GPU, no
  side effects, used by agents/scripts to discover what's installable
  on the CLI before composing a render command.
rationale: >
  The CLI exposes a finite, growing set of engines and a fixed set of
  palettes. Hardcoding their names into scripts couples the script to
  the engine version. `list` is the canonical discovery surface.

actors:
  - cli
  - agent

inputs:
  schema_name: ListEnginesRequest
  fields:
    - name: format
      type: enum { Human, Json }
      required: false
      default: Human
      description: >
        Controlled via the global `--json` flag on the `art-engine`
        CLI today (not a per-subcommand `--format` flag). When
        `--json` is set, the JSON output below is emitted; otherwise
        a human-readable list is printed.

outputs:
  schema_name: ListReport
  schema_version: 0  # ← not present in current output; see compatibility section
  fields:
    - name: engines
      type: 'string[]'
      description: >
        Stable engine identifiers in registration order. Currently:
        gray-scott, physarum, mandelbrot, particles, dla, attractor,
        ising, differential, quantum. Adding an engine is additive
        (non-breaking). Removing one is breaking.
    - name: palettes
      type: 'string[]'
      description: >
        Palette names available via `Palette::from_name`. Currently:
        ocean, neon, earth, monochrome, vapor, fire, amber.

  formats:
    human_readable:
      contract: |
        Two sections on stdout:
          Engines:
            <name>
            <name>
            ...
          Palettes:
            <name>, <name>, ...
    json:
      contract: |
        One complete JSON object on stdout. Field order:
        `{ "engines": [...], "palettes": [...] }`. Pretty-printed
        (2-space indent). NO `schema_version` field today — see
        compatibility below.

errors:
  closed_set: []
  notes: |
    `list` cannot fail in practice — the engine and palette registries
    are compile-time `&'static [&'static str]` arrays. The command
    inherits the global `CliError` for unrecoverable I/O on stdout
    (broken pipe etc.), which exits with the spec's general-error code
    1.

authority:
  requires_filesystem: false
  requires_network: false
  requires_credentials: false
  requires_process_execution: false
  requires_destructive_write: false
  requires_telemetry: false
  permission_behavior: none
  authority_types: []
  notes: 'Pure registry read; no side effects.'

lifecycle:
  long_running: false
  owner_scope: command
  states:
    - completed
  cancellation: none
  cleanup_required: false
  cleanup_behavior: none
  error_behavior: typed error

interfaces:
  cli:
    exposed: true
    command: 'art-engine list [--json]'
    json_output_required: true
    stdin_supported: false
    stdout_supported: true
    exit_codes:
      - code: 0
        meaning: success
      - code: 2
        meaning: clap parser usage error (e.g. unknown flag)
    stdout_contract: 'Either the two-section human listing OR the JSON object.'
    stderr_contract: 'Empty on success.'
  desktop:
    exposed: false
  api:
    exposed: false

observability:
  events: []
  metrics: []
  logs: []
  secrets_redacted: true

acceptance_criteria:
  - 'list outputs every registered engine'
  - 'list outputs every named palette'
  - 'JSON output is valid JSON, never mixed with human text'
  - 'Exit code 0 on success'

required_tests:
  - 'Human snapshot test: not yet wired'
  - 'JSON snapshot test: not yet wired'
  - 'Compatibility test that registered engines round-trip through from_name: not yet wired (would catch breaking renames)'

compatibility:
  machine_output_schema: 'ListReport (unversioned)'
  breaking_change_requires: ADR or capability version bump
  surfaces:
    - 'Engine name strings (gray-scott, physarum, …) — used as `art-engine render <name>` arguments'
    - 'Palette name strings — used as `--palette <name>` arguments'
    - 'JSON top-level field names: engines, palettes'
    - 'CLI exit codes (0/2)'
  open_drift:
    - >
      The current JSON output does not carry a `schema_version` field, in
      tension with the foundation seed's policy that "documented JSON
      fields should be versioned or treated as compatibility-sensitive."
      Adding `schema_version: 1` is additive (non-breaking for parsers
      that ignore unknown fields) and would let downstream consumers
      detect the bump in semantics. Queued for the next CLI iteration.
    - >
      Adding an engine is additive but appears as a new line in human
      output (which CI scripts may snapshot). Treat human output as
      advisory, not contract — the JSON shape is the supported surface.
