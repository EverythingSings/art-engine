[package]
name = "art-engine-storyboard"
version = "0.1.0"
edition = "2021"
description = "Scene composition primitives + RON storyboard format for the art-engine"

[dependencies]
art-engine-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.8"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
